name: Create Release on Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and attach to its GitHub release"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        working-directory: .
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$RELEASE_TAG" == *".."* ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Setup Android CI
        uses: ./.github/actions/setup-android-ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android toolchains
        run: |
          just install-toolchains
          just install-ndk

      - name: Build unsigned universal release APK
        env:
          BUILD_MODE: release
        run: ./gradlew :app:assembleUniversalRelease -Pchannel=universal -PuseLegacyPackaging=true

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"
          chmod 600 "${RUNNER_TEMP}/release.keystore"

      - name: Sign universal release APK and generate checksum
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          APKSIGNER="$(find "${ANDROID_HOME:?}/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          UNSIGNED_APK="app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          APK_NAME="gem_wallet_universal_${RELEASE_TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          mkdir -p "$OUT_DIR"
          "$APKSIGNER" sign \
            --ks "${RUNNER_TEMP}/release.keystore" \
            --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --out "${OUT_DIR}/${APK_NAME}" \
            "$UNSIGNED_APK"
          "$APKSIGNER" verify "${OUT_DIR}/${APK_NAME}"
          (cd "$OUT_DIR" && sha256sum "$APK_NAME" > "$SHA_NAME" && cat "$SHA_NAME")

      - name: Remove signing keystore
        if: always()
        working-directory: .
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT_DIR="${RUNNER_TEMP}/release-assets"
          APK_NAME="gem_wallet_universal_${RELEASE_TAG}.apk"
          SHA_NAME="${APK_NAME}.sha256"
          APK_PATH="${OUT_DIR}/${APK_NAME}"
          SHA_PATH="${OUT_DIR}/${SHA_NAME}"
          SHA_LINE="$(cat "$SHA_PATH")"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            IS_PRERELEASE="$INPUT_PRERELEASE"
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" --repo "$GITHUB_REPOSITORY" --clobber
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            else
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
            fi
          else
            NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
            GENERATED_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq '.body')"
            {
              if [[ -n "$GENERATED_NOTES" ]]; then
                printf '%s\n\n' "$GENERATED_NOTES"
              fi
              printf '## Verification\n```text\n%s\n```\n' "$SHA_LINE"
            } > "$NOTES_FILE"

            FLAGS=(--repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "$NOTES_FILE")
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              FLAGS+=(--prerelease)
            else
              FLAGS+=(--latest)
            fi
            gh release create "$RELEASE_TAG" "$APK_PATH" "$SHA_PATH" "${FLAGS[@]}"
          fi
